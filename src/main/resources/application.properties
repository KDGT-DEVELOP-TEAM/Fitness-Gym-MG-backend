spring.application.name=fitnessgym_mg

# Database Configuration (Supabase PostgreSQL)
# Supabaseダッシュボードの Settings > Database から接続情報を取得してください
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.cwybkjzapzrxtcyvctuk
spring.datasource.password=fitnessgym_mg2025
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL Scripts (schema.sql, data.sql) を実行する設定
# Supabase管理のためローカルSQLは実行しない
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true
