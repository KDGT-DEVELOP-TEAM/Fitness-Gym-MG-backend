spring.application.name=fitnessgym_mg

# Database Configuration (Supabase PostgreSQL)
# Supabaseダッシュボードの Settings > Database から接続情報を取得してください
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.cwybkjzapzrxtcyvctuk
#spring.datasource.password=fitnessgym_mg2025
spring.datasource.password=${SUPABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
# Supabaseの接続プーラー（Transactionモード）に合わせて接続数を設定
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL Scripts (schema.sql, data.sql) を実行する設定
# 空のファイルなので無効化（必要に応じて有効化）
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true

# Supabase Storage設定
supabase.storage.url=${SUPABASE_STORAGE_URL:https://your-project.supabase.co}
supabase.storage.service-key=${SUPABASE_SERVICE_KEY}
supabase.storage.bucket=${SUPABASE_BUCKET_NAME:postures}
supabase.storage.max-file-size-mb=${SUPABASE_MAX_FILE_SIZE_MB:10}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB