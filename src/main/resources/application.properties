spring.application.name=fitnessgym_mg

# Database Configuration (Supabase PostgreSQL)
# Supabaseダッシュボードの Settings > Database から接続情報を取得してください
#
# 設計方針
# - カスタムJWT実装を維持し、Supabase RLSは使用しない
# - データベース接続は管理者権限（postgresユーザー）で行う
# - セキュリティはSpringアプリケーション層（Spring Security + JWT）で完全に制御する
# - Supabase RLSは無効化されていることを前提とする
#
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.cwybkjzapzrxtcyvctuk
#spring.datasource.password=fitnessgym_mg2025
spring.datasource.password=${SUPABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
# Supabaseの接続プーラー（Transactionモード）に合わせて接続数を設定
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL Scripts (schema.sql, data.sql) を実行する設定
# 空のファイルなので無効化（必要に応じて有効化）
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true

# Spring Profiles
# serverプロファイルを有効化すると、実際のSupabaseStorageServiceが使用されます
# 開発環境でも実際のSupabaseストレージを使用する場合は、環境変数SPRING_PROFILES_ACTIVE=serverを設定してください
# または、この行のコメントを外して直接設定することも可能です（非推奨）
spring.profiles.active=server

# Supabase Storage設定
supabase.storage.url=${SUPABASE_STORAGE_URL:https://your-project.supabase.co}
supabase.storage.service-key=${SUPABASE_SERVICE_KEY}
supabase.storage.bucket=${SUPABASE_BUCKET_NAME:postures}
supabase.storage.max-file-size-mb=${SUPABASE_MAX_FILE_SIZE_MB:10}

# Supabase Auth設定
supabase.auth.url=${SUPABASE_AUTH_URL:https://cwybkjzapzrxtcyvctuk.supabase.co}
supabase.auth.service-key=${SUPABASE_SERVICE_KEY}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
# 秘密鍵は本番環境では必ず環境変数から設定してください（256ビット以上推奨）
jwt.secret=${JWT_SECRET:fitnessgym-mg-secret-key-change-this-in-production-256bit}
# トークン有効期限（ミリ秒）: 24時間 = 86400000ms
jwt.expiration=${JWT_EXPIRATION:86400000}
# JWTトークンの対象（audience）
jwt.audience=${JWT_AUDIENCE:frontend}

# Login Rate Limit Configuration
# ログイン試行回数の上限（デフォルト: 5回）
login.rate-limit.max-attempts=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
# ログイン試行回数の時間窓（分）（デフォルト: 5分）
login.rate-limit.time-window-minutes=${LOGIN_RATE_LIMIT_TIME_WINDOW_MINUTES:5}

# ForwardedHeaderFilterの設定
# X-Forwarded-Forヘッダーを適切に処理し、信頼できるプロキシからのIPのみを取得
server.forward-headers-strategy=framework

# CORS Configuration
# 許可するオリジン（カンマ区切りで複数指定可能）
# 開発環境: Viteのデフォルトは5173、現在の設定は3000
# 公共WiFi環境: フロントエンドの実際のIPアドレスを使用する場合は
#   http://192.168.x.x:3000 などの形式を追加
# 両方を許可する場合: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173
# 本番環境: https://yourdomain.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}