<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>顧客管理</title>
	<link rel="stylesheet" th:href="@{/css/reset.css}" />
	<link rel="stylesheet" th:href="@{/css/style.css}" />
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 0;
			padding: 0;
			background-color: #f5f5f5;
		}
		.sidebar {
			width: 250px;
			background-color: #2c3e50;
			color: white;
			padding: 20px;
			min-height: 100vh;
			position: fixed;
			left: 0;
			top: 0;
			z-index: 1000;
		}
		.sidebar h2 {
			margin-top: 0;
			margin-bottom: 30px;
			font-size: 20px;
			border-bottom: 2px solid #3498db;
			padding-bottom: 10px;
		}
		.sidebar ul {
			list-style: none;
			padding: 0;
			margin: 0;
		}
		.sidebar li {
			margin-bottom: 10px;
		}
		.sidebar a {
			color: white;
			text-decoration: none;
			display: block;
			padding: 12px 15px;
			border-radius: 4px;
			transition: background-color 0.3s;
		}
		.sidebar a:hover {
			background-color: #34495e;
		}
		.sidebar a.active {
			background-color: #3498db;
		}
		.main-content {
			padding: 20px;
			box-sizing: border-box;
		}
		.main-content.with-sidebar {
			margin-left: 250px;
		}
		table {
			width: 100%;
			border-collapse: collapse;
			margin-top: 20px;
		}

		table th,
		table td {
			border: 1px solid #ccc;
			padding: 8px 10px;
			text-align: left;
		}

		table th {
			font-weight: bold;
		}

		#modalDeleteBtn {
			background-color: #dc3545;
			color: white;
			border: none;
			padding: 10px 15px;
			cursor: pointer;
			margin-top: 15px;
		}

		.required-label {
			display: inline-block;
			padding: 2px 6px;
			margin-left: 5px;
			font-size: 0.75em;
			font-weight: bold;
			color: white;
			/* 白字 */
			background-color: #dc3545;
			/* 赤い背景色 */
			border-radius: 3px;
			vertical-align: middle;
		}
	</style>
	<script th:inline="javascript">
		/* <![CDATA[ */
		// ★ 1. Controllerから現在のベースパスを取得する ★
		const storeId = /*[[${storeId}]]*/ null;
		const BASE_PATH = storeId
			? `/manager/${storeId}/customers`
			: '/admin/customers';
		const API_BASE_PATH = BASE_PATH;
		/* ]]> */

		document.addEventListener("DOMContentLoaded", () => {

			// モーダル内の削除ボタン要素を取得
			const modalDeleteBtn = document.getElementById("modalDeleteBtn");

			// --- 削除 (モーダル内のボタンにイベントを設定) ---
			modalDeleteBtn.onclick = async () => {
				const id = modalDeleteBtn.dataset.id;
				if (!confirm("顧客を完全に削除しますか？ (有効な顧客は削除できません)")) return;

				// レスポンスを受け取り、成功/失敗をチェックする
				const response = await fetch(`${API_BASE_PATH}/${id}/delete`, {method: "DELETE"});

				if (response.ok) {
					// 成功した場合 (HTTP 2xx)
					location.reload();
				} else {
					// 失敗した場合 (HTTP 4xx/5xx - 関連データがある場合など)

					// サーバーから返されたエラーメッセージを取得
					let errorText = "関連データが存在するか、サーバーエラーが発生しました。";
					try {
						// Spring Bootのデフォルト設定では、IllegalStateExceptionのメッセージがレスポンスボディに含まれる
						errorText = await response.text();
					} catch (e) {
						// レスポンスボディが空の場合など
					}

					// ユーザーにアラートで具体的な理由を通知
					alert(`削除に失敗しました: ${errorText}`);
				}
			};

			// --- フィルタ送信 ---
			document.getElementById("filterForm").onsubmit = (e) => {
				e.preventDefault();
				const params = new URLSearchParams(new FormData(e.target));
				location.href = `${BASE_PATH}?${params.toString()}`;
			};

			document.getElementById("clearBtn").onclick = () => {
				location.href = BASE_PATH;
			};

			// --- 新規作成モーダル ---
			document.getElementById("openCreateModal").onclick = () => {
				document.getElementById("createForm").reset();
				document.getElementById("createError").textContent = "";
				document.getElementById("createAgeDisplay").textContent = "-";
				document.getElementById("createModal").style.display = "block";
			};
			document.getElementById("createForm").onsubmit = async (e) => {
				e.preventDefault();
				const data = Object.fromEntries(new FormData(e.target));
				const errorDiv = document.getElementById("createError"); // エラー表示要素を取得
				errorDiv.textContent = ""; // 実行前にクリア

				data.active = true;
				data.height = parseFloat(data.height);

				const response = await fetch(`${API_BASE_PATH}/create`, {
					method: "POST",
					headers: {"Content-Type": "application/json"},
					body: JSON.stringify(data)
				});

				if (response.ok) {
					location.reload();
				} else {
					const errorText = await response.text();
					errorDiv.textContent = `バリデーションエラー: ${errorText}`;
				}
			};

			// --- 有効/無効 ---
			document.querySelectorAll(".toggleActive").forEach(btn => {
				btn.onclick = async () => {
					const id = btn.dataset.id;
					const currentState = btn.textContent.trim();

					let endpoint;

					// 現在 '有効' なら、次は無効化(disable)を行う
					if (currentState === '有効') {
						endpoint = '/disable';
					} else {
						// 現在 '無効' なら、次は有効化(enable)を行う
						endpoint = '/enable';
					}

					// /enable または /disable を使用
					await fetch(`${API_BASE_PATH}/${id}${endpoint}`, {method: "PATCH"});
					location.reload();
				};
			});

			// --- 編集モーダル ---
			document.querySelectorAll(".editBtn").forEach(btn => {
				btn.onclick = async () => {

					const id = btn.dataset.id;
					const form = document.getElementById("editForm");
					const errorDiv = document.getElementById("editError");
					errorDiv.textContent = "";

					try {
						const response = await fetch(`${API_BASE_PATH}/${id}/detail`);
						
						if (!response.ok) {
							let errorMessage = "データの取得に失敗しました。";
							if (response.status === 403) {
								errorMessage = "この顧客を編集する権限がありません。";
							} else if (response.status === 404) {
								errorMessage = "顧客が見つかりません。";
							} else {
								try {
									const errorText = await response.text();
									if (errorText) {
										errorMessage = errorText;
									}
								} catch (e) {
									// エラーテキストの取得に失敗した場合はデフォルトメッセージを使用
								}
							}
							errorDiv.textContent = errorMessage;
							document.getElementById("editModal").style.display = "block";
							return;
						}

						const customer = await response.json();

						form.id.value = customer.id;
						document.getElementById("edit-id-display").value = customer.id;
						form.name.value = customer.name;
						form.kana.value = customer.kana;
						form.email.value = customer.email;
						form.gender.value = customer.gender;
						form.birthday.value = customer.birthday;
						form.height.value = customer.height;
						form.phone.value = customer.phone;
						form.address.value = customer.address;
						form.medical.value = customer.medical || '';
						form.taboo.value = customer.taboo || '';
						form.memo.value = customer.memo || '';
						form.firstPostureGroupId.value = customer.firstPostureGroupId || '';
						form.active.checked = customer.active;

						// 編集モーダルオープン時に年齢表示を更新
						document.getElementById("editAgeDisplay").textContent = calcAge(customer.birthday);

						// 削除ボタンの状態制御
						if (customer.active) {
							// 有効な場合は非表示
							modalDeleteBtn.style.display = 'none';
							modalDeleteBtn.dataset.id = '';
						} else {
							// 無効な場合は表示し、IDを設定
							modalDeleteBtn.style.display = 'block';
							modalDeleteBtn.dataset.id = id;
						}

						document.getElementById("editModal").style.display = "block";
					} catch (error) {
						errorDiv.textContent = "データの取得中にエラーが発生しました: " + error.message;
						document.getElementById("editModal").style.display = "block";
					}
				};
			});

			// --- 編集保存 ---
			document.getElementById("editForm").onsubmit = async (e) => {
				e.preventDefault();

				const data = Object.fromEntries(new FormData(e.target));
				const errorDiv = document.getElementById("editError"); // エラー表示要素を取得
				errorDiv.textContent = ""; // 実行前にクリア

				data.active = e.target.active.checked;
				data.height = parseFloat(data.height);

				// firstPostureGroupId が空の場合は null にする (UUID型送信のため)
				if (data.firstPostureGroupId === "") {
					data.firstPostureGroupId = null;
				}

				// 編集時の初回姿勢画像必須チェック（クライアントサイド）
				if (!data.firstPostureGroupId) {
					errorDiv.textContent = "初回姿勢画像IDは編集時に必須です。";
					return;
				}

				const response = await fetch(`${API_BASE_PATH}/${data.id}/edit`, {
					method: "PUT",
					headers: {"Content-Type": "application/json"},
					body: JSON.stringify(data)
				});

				if (response.ok) {
					location.reload();
				} else {
					const errorText = await response.text();
					errorDiv.textContent = `バリデーションエラー: ${errorText}`;
				}
			};

			// 年齢計算関数
			function calcAge(birthdayStr) {
				if (!birthdayStr) return "-";

				const today = new Date();
				const birth = new Date(birthdayStr);

				let age = today.getFullYear() - birth.getFullYear();
				const m = today.getMonth() - birth.getMonth();
				const d = today.getDate() - birth.getDate();

				// 誕生日がまだ来ていなければ -1
				if (m < 0 || (m === 0 && d < 0)) {
					age--;
				}

				return age;
			}
			// 新規作成モーダル：誕生日入力で年齢更新
			document.querySelector("#createForm input[name='birthday']")
				.addEventListener("change", (e) => {
					document.getElementById("createAgeDisplay").textContent = calcAge(e.target.value);
				});
			// 編集モーダル：誕生日セット時に年齢更新
			document.querySelector("#editForm input[name='birthday']")
				.addEventListener("change", (e) => {
					document.getElementById("editAgeDisplay").textContent = calcAge(e.target.value);
				});

			// モーダルを閉じる
			document.querySelectorAll(".closeModal").forEach(btn => {
				btn.onclick = () => {
					btn.closest(".modal").style.display = "none";
				};
			});

		});
	</script>
</head>

<body>
	<!-- 店長用サイドバー -->
	<div class="sidebar" th:if="${isManager}">
		<h2>メニュー</h2>
		<ul>
			<li>
				<a th:href="@{'/manager/' + ${storeId} + '/lessons'}" 
				   th:classappend="${currentPage != null and currentPage == 'lessons'} ? 'active' : ''">店舗統計</a>
			</li>
			<li>
				<a th:href="@{'/manager/' + ${storeId} + '/customers'}" 
				   th:classappend="${currentPage != null and currentPage == 'customers'} ? 'active' : ''">顧客一覧</a>
			</li>
			<li>
				<a th:href="@{'/manager/' + ${storeId} + '/users'}" 
				   th:classappend="${currentPage != null and currentPage == 'users'} ? 'active' : ''">トレーナー一覧</a>
			</li>
		</ul>
	</div>
	
	<!-- メインコンテンツ -->
	<div class="main-content" th:classappend="${isManager} ? 'with-sidebar' : ''">
		<button id="openCreateModal">＋ 新規顧客作成</button>

	<form id="filterForm">
		<input type="text" name="keyword" placeholder="名前検索（漢字・ふりがな）" th:value="${keyword}">

		<select name="sort">
			<option value="created" th:selected="${sort == 'created'}">作成日順</option>
		</select>

		<button type="submit">検索</button>
		<button type="button" id="clearBtn">クリア</button>
	</form>

	<p><span th:text="${count}"></span> 件が見つかりました</p>

	<div th:if="${customerPage.content.isEmpty()}">該当する顧客は見つかりませんでした</div>

	<table>
		<tr>
			<th>名前</th>
			<th>年齢</th>
			<th>有効/無効</th>
			<th>操作</th>
		</tr>

		<tr th:each="c : ${customerPage.content}">
			<td>
				<a th:href="@{${BASE_PATH} + '/' + ${c.id} + '/lessons'}" th:text="${c.name}">顧客名</a>
			</td>
			<td th:text="${c.age} + '歳'"></td>

			<td>
				<button class="toggleActive" th:attr="data-id=${c.id}" th:text="${c.active} ? '有効' : '無効'">
				</button>
			</td>

			<td>
				<button class="editBtn" th:attr="data-id=${c.id}">詳細/編集</button>
			</td>
		</tr>
	</table>

	<div class="pagination">
		<a th:if="${customerPage.hasPrevious()}"
			th:href="@{${BASE_PATH}(page=${customerPage.number - 1}, keyword=${keyword}, sort=${sort}, size=10)}">前へ</a>

		<span th:text="${customerPage.number + 1}"></span> /
		<span th:text="${customerPage.totalPages}"></span>

		<a th:if="${customerPage.hasNext()}"
			th:href="@{${BASE_PATH}(page=${customerPage.number + 1}, keyword=${keyword}, sort=${sort}, size=10)}">次へ</a>
	</div>


	<div id="createModal" class="modal" style="display:none;">
		<div>
			<button class="closeModal">× 入力情報を保存せず一覧に戻る</button>
			<h2>新規顧客作成</h2>
			<div id="createError" style="color: red; margin-bottom: 10px;"></div>
			<form id="createForm">
				<input name="name" placeholder="氏名" required> <span class="required-label">必須</span>
				<input name="kana" placeholder="フリガナ" required> <span class="required-label">必須</span>
				<select name="gender" required>
					<option value="">性別</option>
					<option th:each="g : ${genders}" th:value="${g}" th:text="${g}"></option>
				</select> <span class="required-label">必須</span>
				<input type="date" name="birthday" placeholder="生年月日" required> <span class="required-label">必須</span>
				<div>現在の年齢：<span id="createAgeDisplay">-</span> 歳</div>
				<input type="number" step="0.1" name="height" placeholder="身長(cm)" required>　<span
					class="required-label">必須</span>
				<input name="email" placeholder="メール" required> <span class="required-label">必須</span>
				<input name="phone" placeholder="電話番号" required> <span class="required-label">必須</span>
				<input name="address" placeholder="住所" required> <span class="required-label">必須</span>

				<input name="medical" placeholder="既往歴">
				<input name="taboo" placeholder="禁忌事項">
				<textarea name="memo" placeholder="メモ"></textarea>

				<button type="submit">保存</button>
			</form>
		</div>
	</div>

	<div id="editModal" class="modal" style="display:none;">
		<div>
			<button class="closeModal">× 入力情報を保存せず一覧に戻る</button>
			<h2>顧客編集</h2>
			<div id="editError" style="color: red; margin-bottom: 10px;"></div>
			<form id="editForm">
				<input type="hidden" name="id">
				<div class="form-group">
					<label for="edit-id-display">顧客ID</label>
					<input type="text" id="edit-id-display" readonly disabled class="form-control" placeholder="UUID">
				</div>

				<input name="name" required placeholder="氏名"> <span class="required-label">必須</span>
				<input name="kana" required placeholder="フリガナ"> <span class="required-label">必須</span>
				<select name="gender" required>
					<option value="男">男</option>
					<option value="女">女</option>
				</select> <span class="required-label">必須</span>
				<input type="date" name="birthday" required placeholder="誕生日"> <span class="required-label">必須</span>
				<div>現在の年齢：<span id="editAgeDisplay">-</span> 歳</div>
				<input type="number" step="0.1" name="height" required placeholder="身長（cm）">　<span
					class="required-label">必須</span>
				<input name="email" required placeholder="メールアドレス"> <span class="required-label">必須</span>
				<input name="phone" required placeholder="電話番号"> <span class="required-label">必須</span>
				<input name="address" required placeholder="住所"> <span class="required-label">必須</span>

				<input name="medical" placeholder="既往歴">
				<input name="taboo" placeholder="禁忌事項">
				<textarea name="memo" placeholder="メモ"></textarea>

				<input name="firstPostureGroupId" placeholder="初回姿勢画像ID (UUID)" required> <span
					class="required-label">必須</span>

				<label>
					<input type="checkbox" name="active"> 有効
				</label>

				<button type="submit">保存</button>
			</form>

			<hr>

			<button id="modalDeleteBtn" style="display:none;">この顧客を削除</button>
		</div>
	</div>
	</div>

</body>

</html>
