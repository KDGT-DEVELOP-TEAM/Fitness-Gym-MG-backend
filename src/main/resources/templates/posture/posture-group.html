<!DOCTYPE html>
<!--
  姿勢画像一覧ページ
  動作: JavaScriptで /api/customers/{customerId}/posture_groups を呼び出し
        APIから取得したJSONデータを動的に表示
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>姿勢画像一覧 - FitnessGym MG</title>
    <link rel="stylesheet" th:href="@{/css/reset.css}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <!-- サイドバー -->
    <div class="sidebar" th:if="${isTrainer}">
        <h2>メニュー</h2>
        <ul>
            <li>
                <a th:href="@{'/trainer/history/' + ${customerId}}" class="">履歴一覧</a>
            </li>
            <li>
                <a th:href="@{'/trainer/customers/' + ${customerId}}" class="">顧客プロフィール</a>
            </li>
            <li>
                <a th:href="@{'/trainer/postures?customerId=' + ${customerId}}" class="active">姿勢画像一覧</a>
            </li>
            <li>
                <a th:href="@{'/trainer/lessons/new?customerId=' + ${customerId}}" class="">新規レッスン入力</a>
            </li>
        </ul>
    </div>
    
    <!-- メインコンテンツ -->
    <div class="main-content" th:classappend="${isTrainer} ? 'with-sidebar' : ''">
    <main>
      <!-- 顧客IDをdata属性として保持（JavaScriptで使用） -->
      <section class="posture-groups" th:attr="data-customer-id=${customerId}">
      <header class="posture-groups__header">
        <h1>姿勢画像一覧</h1>
        <p class="posture-groups__description">
          最新のレッスンから順に、撮影した姿勢画像グループを表示します。各グループを選択すると比較画面に移動できます。
        </p>
      </header>

      <div id="posture-groups-empty" class="posture-groups__empty" hidden>
        姿勢画像が登録されていません。
      </div>

      <div id="posture-groups-error" class="posture-groups__error" hidden>
        <p>姿勢画像の読み込みに失敗しました。ページを再読み込みしてください。</p>
        <p id="error-details" style="color: red; font-size: 0.9em; margin-top: 0.5em;"></p>
      </div>

      <div id="posture-groups-loading" class="posture-groups__loading">
        読み込み中...
      </div>
      <div id="posture-groups-container" class="posture-groups__list" hidden></div>

      <nav id="posture-groups-pagination" class="posture-groups__pagination" hidden>
        <button type="button" data-action="prev" disabled>前へ</button>
        <span class="posture-groups__page-indicator"></span>
        <button type="button" data-action="next" disabled>次へ</button>
      </nav>
    </section>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const SECTION = document.querySelector('.posture-groups');
        if (!SECTION) return;

        const customerId = SECTION.dataset.customerId;
        if (!customerId) {
          console.error('Customer ID not found');
          return;
        }
        console.log('Customer ID:', customerId);
        const container = document.getElementById('posture-groups-container');
        const loadingState = document.getElementById('posture-groups-loading');
        const emptyState = document.getElementById('posture-groups-empty');
        const errorState = document.getElementById('posture-groups-error');
        const pagination = document.getElementById('posture-groups-pagination');
        const pageIndicator = pagination.querySelector('.posture-groups__page-indicator');
        const PAGE_SIZE = 10;
        let currentPage = 1;
        let groups = [];

        // Storageの公開URL生成
        // posturesバケットの公開URLベース
        const SUPABASE_PUBLIC_BASE = 'https://cwybkjzapzrxtcyvctuk.supabase.co/storage/v1/object/public/postures';

        // storageKey（相対パスまたは完全URL）をStorage公開URLに変換
        const toPublicUrl = (storageKey) => {
          if (!storageKey) return '';
          if (storageKey.startsWith('http://') || storageKey.startsWith('https://')) {
            return storageKey; // 既に完全URLの場合
          }
          // 相対パスの場合はStorage公開URLベースに結合
          return `${SUPABASE_PUBLIC_BASE}${storageKey.startsWith('/') ? storageKey : '/' + storageKey}`;
        };

        const formatDateTime = (value) => {
          if (!value) return '日時未設定';
          const date = new Date(value);
          return new Intl.DateTimeFormat('ja-JP', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
          }).format(date);
        };

        const buildImageElement = (group, image) => {
          const link = document.createElement('a');
          link.className = 'posture-groups__image';
          link.href = `/customers/${customerId}/posture/compare?groupId=${group.id}&imageId=${image.id}`;
          link.dataset.posturePosition = image.position ?? '';

          const figure = document.createElement('figure');
          const img = document.createElement('img');
          img.src = toPublicUrl(image.storageKey);
          img.alt = `${image.position ?? 'unknown'} posture image`;
          img.loading = 'lazy';

          const caption = document.createElement('figcaption');
          caption.textContent = image.position ?? '画像';

          figure.appendChild(img);
          figure.appendChild(caption);
          link.appendChild(figure);
          return link;
        };

        const renderGroups = () => {
          if (loadingState) loadingState.hidden = true;
          container.innerHTML = '';

          if (!groups.length) {
            container.hidden = true;
            emptyState.hidden = false;
            pagination.hidden = true;
            return;
          }

          container.hidden = false;
          emptyState.hidden = true;
          const start = (currentPage - 1) * PAGE_SIZE;
          const end = start + PAGE_SIZE;
          const pageItems = groups.slice(start, end);

          pageItems.forEach((group) => {
            const card = document.createElement('article');
            card.className = 'posture-groups__card';

            const header = document.createElement('header');
            header.className = 'posture-groups__card-header';
            header.innerHTML = `
              <h2>レッスン日: ${formatDateTime(group.lessonStartDate)}</h2>
              <p>登録日時: ${formatDateTime(group.capturedAt)}</p>
            `;

            const imageContainer = document.createElement('div');
            imageContainer.className = 'posture-groups__card-images';

            if (group.images?.length) {
              group.images.forEach((image) => {
                imageContainer.appendChild(buildImageElement(group, image));
              });
            } else {
              imageContainer.textContent = '画像が登録されていません。';
            }

            card.appendChild(header);
            card.appendChild(imageContainer);
            container.appendChild(card);
          });

          const totalPages = Math.ceil(groups.length / PAGE_SIZE);
          pagination.hidden = totalPages <= 1;
          pageIndicator.textContent = `${currentPage} / ${totalPages}`;

          pagination.querySelector('[data-action="prev"]').disabled = currentPage <= 1;
          pagination.querySelector('[data-action="next"]').disabled = currentPage >= totalPages;
        };

        const attachPaginationHandlers = () => {
          pagination.addEventListener('click', (event) => {
            const button = event.target.closest('button[data-action]');
            if (!button) return;

            const totalPages = Math.ceil(groups.length / PAGE_SIZE);
            if (button.dataset.action === 'prev' && currentPage > 1) {
              currentPage -= 1;
            } else if (button.dataset.action === 'next' && currentPage < totalPages) {
              currentPage += 1;
            }
            renderGroups();
          });
        };

        // APIから姿勢画像グループ一覧を取得
        const fetchGroups = async () => {
          try {
            const response = await fetch(`/api/customers/${customerId}/posture_groups`);
            if (!response.ok) {
              const errorText = await response.text();
              throw new Error(`HTTP ${response.status}: ${errorText || 'Unknown error'}`);
            }
            groups = await response.json(); // APIからのJSONレスポンスをパース
            console.log('Fetched groups:', groups);
            renderGroups();
          } catch (error) {
            console.error('Error fetching groups:', error);
            if (loadingState) loadingState.hidden = true;
            container.hidden = true;
            const errorDetails = document.getElementById('error-details');
            if (errorDetails) {
              errorDetails.textContent = error.message;
            }
            errorState.hidden = false;
            emptyState.hidden = true;
            pagination.hidden = true;
            container.innerHTML = '';
          }
        };

        attachPaginationHandlers();
        fetchGroups();
      });
    </script>
    </main>
    </div>
  </body>
</html>
