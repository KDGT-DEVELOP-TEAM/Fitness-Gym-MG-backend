<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レッスン詳細 | フィットネスジム管理システム</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .detail-section {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 4px;
            background: #f9f9f9;
        }
        .detail-section h2 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        .detail-row {
            display: flex;
            margin-bottom: 15px;
        }
        .detail-label {
            font-weight: bold;
            width: 200px;
            color: #555;
        }
        .detail-value {
            flex: 1;
            color: #333;
        }
        .training-item {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            border-left: 4px solid #007bff;
        }
        .posture-images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .posture-image-card {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            background: white;
        }
        .posture-image-placeholder {
            width: 100%;
            height: 200px;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            border-radius: 4px;
        }
        .button-group {
            margin-top: 30px;
        }
        button, .button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        button:hover, .button:hover {
            background: #0056b3;
        }
        .back-button {
            background: #6c757d;
            margin-left: 10px;
        }
        .back-button:hover {
            background: #5a6268;
        }
        .bmi-value {
            font-size: 1.2em;
            color: #007bff;
            font-weight: bold;
        }
        .no-data {
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>レッスン詳細</h1>
    
    <!-- 基本情報 -->
    <div class="detail-section">
        <h2>基本情報</h2>
        <div class="detail-row">
            <div class="detail-label">顧客名:</div>
            <div class="detail-value" th:text="${lesson.customerName}"></div>
        </div>
        <div class="detail-row">
            <div class="detail-label">担当トレーナー:</div>
            <div class="detail-value" th:text="${lesson.trainerName}"></div>
        </div>
        <div class="detail-row">
            <div class="detail-label">実施店舗:</div>
            <div class="detail-value" th:text="${lesson.storeName}"></div>
        </div>
        <div class="detail-row">
            <div class="detail-label">実施日時:</div>
            <div class="detail-value">
                <span th:text="${#temporals.format(lesson.startDate, 'yyyy/MM/dd HH:mm')}"></span>
                〜
                <span th:text="${#temporals.format(lesson.endDate, 'yyyy/MM/dd HH:mm')}"></span>
            </div>
        </div>
    </div>
    
    <!-- 体調・体重情報 -->
    <div class="detail-section">
        <h2>体調・体重</h2>
        <div class="detail-row">
            <div class="detail-label">体重:</div>
            <div class="detail-value">
                <span th:if="${lesson.weight != null}" th:text="${lesson.weight} + ' kg'"></span>
                <span th:if="${lesson.weight == null}" class="no-data">記録なし</span>
            </div>
        </div>
        <div class="detail-row">
            <div class="detail-label">BMI:</div>
            <div class="detail-value">
                <span th:if="${lesson.bmi != null}" class="bmi-value" th:text="${lesson.bmi}"></span>
                <span th:if="${lesson.bmi == null}" class="no-data">計算不可</span>
            </div>
        </div>
        <div class="detail-row">
            <div class="detail-label">体調:</div>
            <div class="detail-value">
                <span th:if="${lesson.condition != null}" th:text="${lesson.condition}"></span>
                <span th:if="${lesson.condition == null}" class="no-data">記録なし</span>
            </div>
        </div>
        <div class="detail-row">
            <div class="detail-label">食事:</div>
            <div class="detail-value">
                <span th:if="${lesson.meal != null}" th:text="${lesson.meal}"></span>
                <span th:if="${lesson.meal == null}" class="no-data">記録なし</span>
            </div>
        </div>
    </div>
    
    <!-- トレーニング情報 -->
    <div class="detail-section">
        <h2>トレーニング</h2>
        <div th:if="${lesson.trainings != null and !lesson.trainings.isEmpty()}">
            <div th:each="training : ${lesson.trainings}" class="training-item">
                <div class="detail-row">
                    <div class="detail-label">種目 <span th:text="${training.orderNo}"></span>:</div>
                    <div class="detail-value" th:text="${training.name}"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">回数:</div>
                    <div class="detail-value" th:text="${training.reps} + ' 回'"></div>
                </div>
            </div>
        </div>
        <div th:if="${lesson.trainings == null or lesson.trainings.isEmpty()}" class="no-data">
            トレーニング記録なし
        </div>
    </div>
    
    <!-- 姿勢画像 -->
    <div class="detail-section">
        <h2>姿勢画像</h2>
        <div th:if="${lesson.postureImages != null and !lesson.postureImages.isEmpty()}" class="posture-images">
            <div th:each="image : ${lesson.postureImages}" class="posture-image-card">
                <div class="posture-image-placeholder">
                    <span th:text="'画像: ' + ${image.position}"></span>
                    <!-- 実際の画像表示は後で実装 -->
                    <!-- <img th:src="${image.storageKey}" alt="姿勢画像" /> -->
                </div>
                <p>
                    <strong th:text="${image.position}"></strong><br/>
                    <small th:text="${#temporals.format(image.takenAt, 'yyyy/MM/dd HH:mm')}"></small>
                </p>
            </div>
        </div>
        <div th:if="${lesson.postureImages == null or lesson.postureImages.isEmpty()}" class="no-data">
            姿勢画像なし
        </div>
    </div>
    
    <!-- 次回予約情報 -->
    <div class="detail-section" th:if="${lesson.nextDate != null}">
        <h2>次回予約情報</h2>
        <div class="detail-row">
            <div class="detail-label">次回レッスン日時:</div>
            <div class="detail-value" th:text="${#temporals.format(lesson.nextDate, 'yyyy/MM/dd HH:mm')}"></div>
        </div>
        <div class="detail-row" th:if="${lesson.nextStoreName != null}">
            <div class="detail-label">次回実施店舗:</div>
            <div class="detail-value" th:text="${lesson.nextStoreName}"></div>
        </div>
        <div class="detail-row" th:if="${lesson.nextTrainerName != null}">
            <div class="detail-label">次回担当トレーナー:</div>
            <div class="detail-value" th:text="${lesson.nextTrainerName}"></div>
        </div>
    </div>
    
    <!-- 備考 -->
    <div class="detail-section" th:if="${lesson.memo != null and !lesson.memo.isEmpty()}">
        <h2>備考</h2>
        <div class="detail-value" th:text="${lesson.memo}"></div>
    </div>
    
    <!-- ボタン -->
    <div class="button-group">
        <button type="button" class="back-button" onclick="history.back()">一覧に戻る</button>
    </div>
</body>
</html>
