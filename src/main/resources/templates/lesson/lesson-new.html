<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規レッスン入力 | フィットネスジム管理システム</title>
    <link rel="stylesheet" th:href="@{/css/reset.css}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <style>
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .training-section {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            background: #f9f9f9;
            position: relative;
        }
        .training-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .training-section-header h3 {
            margin: 0;
        }
        .delete-training-btn {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .delete-training-btn:hover {
            background: #c82333;
        }
        .delete-training-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        .add-training-btn {
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            cursor: pointer;
            margin-top: 10px;
        }
        .add-training-btn:hover {
            background: #218838;
        }
        #trainings-container {
            margin: 10px 0;
        }
        .error {
            color: red;
            font-size: 0.9em;
        }
        .success {
            color: green;
            padding: 10px;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .button-group {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .cancel-button {
            background: #6c757d;
            margin-left: 10px;
        }
        .cancel-button:hover {
            background: #5a6268;
        }
        #bmiDisplay {
            font-size: 1.2em;
            color: #007bff;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <!-- サイドバー -->
    <div class="sidebar" th:if="${isTrainer}">
        <h2>メニュー</h2>
        <ul>
            <li>
                <a th:href="@{'/customer/' + ${customerId} + '/lessons'}" class="">履歴一覧</a>
            </li>
            <li>
                <a th:href="@{'/customer/' + ${customerId}}" class="">顧客プロフィール</a>
            </li>
            <li>
                <a th:href="@{'/customer/' + ${customerId} + '/posture_groups'}" class="">姿勢画像一覧</a>
            </li>
            <li>
                <a href="#" class="active">新規レッスン入力</a>
            </li>
        </ul>
        <!-- ログアウトボタン -->
        <div class="logout-section" style="margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.2);">
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" style="width: 100%; padding: 12px 15px; background-color: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; text-align: center; transition: background-color 0.3s;" onmouseover="this.style.backgroundColor='#c0392b'" onmouseout="this.style.backgroundColor='#e74c3c'">ログアウト</button>
            </form>
        </div>
    </div>
    
    <!-- メインコンテンツ -->
    <div class="main-content" th:classappend="${isTrainer} ? 'with-sidebar' : ''">
    <h1>新規レッスン入力</h1>
    
    <div th:if="${successMessage}" class="success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>
    
    <div class="form-group">
        <p><strong>顧客名:</strong> <span th:text="${customer.name}"></span></p>
        <p><strong>身長:</strong> <span th:text="${customer.height}"></span> cm</p>
    </div>
    
    <form th:action="@{${isTrainer ? '/customer/' + customerId + '/lessons' : (storeId != null ? '/manager/' + storeId + '/lessons' : '/admin/lessons')}}" 
          th:object="${lessonRequest}" 
          method="post">
        
        <input type="hidden" th:field="*{customerId}" />
        
        <!-- 担当トレーナー -->
        <div class="form-group">
            <label for="trainerId">担当トレーナー *</label>
            <select th:field="*{trainerId}" id="trainerId" required>
                <option value="">選択してください</option>
                <option th:each="trainer : ${trainers}" 
                        th:value="${trainer.id}" 
                        th:text="${trainer.name}"></option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('trainerId')}" th:errors="*{trainerId}"></span>
        </div>
        
        <!-- 実施店舗 -->
        <div class="form-group">
            <label for="storeId">実施店舗 *</label>
            <select th:field="*{storeId}" id="storeId" required>
                <option value="">選択してください</option>
                <option th:each="store : ${stores}" 
                        th:value="${store.id}" 
                        th:text="${store.name}"></option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('storeId')}" th:errors="*{storeId}"></span>
        </div>
        
        <!-- 体重 -->
        <div class="form-group">
            <label for="weight">体重 (kg)</label>
            <input type="number" th:field="*{weight}" id="weight" step="0.01" placeholder="例: 65.5" />
            <div id="bmiDisplay"></div>
            <span class="error" th:if="${#fields.hasErrors('weight')}" th:errors="*{weight}"></span>
        </div>
        
        <!-- 体調 -->
        <div class="form-group">
            <label for="condition">体調</label>
            <input type="text" th:field="*{condition}" id="condition" placeholder="例: 良好" />
            <span class="error" th:if="${#fields.hasErrors('condition')}" th:errors="*{condition}"></span>
        </div>
        
        <!-- 食事 -->
        <div class="form-group">
            <label for="meal">食事</label>
            <input type="text" th:field="*{meal}" id="meal" placeholder="例: 朝食: バナナ、昼食: サラダ" />
            <span class="error" th:if="${#fields.hasErrors('meal')}" th:errors="*{meal}"></span>
        </div>
        
        <!-- トレーニングセクション -->
        <div class="form-group">
            <label>トレーニング</label>
            <div id="trainings-container">
                <!-- トレーニングセクションはJavaScriptで動的に生成 -->
            </div>
            <button type="button" class="add-training-btn" id="addTrainingBtn">トレーニングを追加</button>
        </div>
        
        <!-- 実施時間 -->
        <div class="form-group">
            <label for="startDate">レッスン開始日時 *</label>
            <input type="datetime-local" th:field="*{startDate}" id="startDate" required />
            <span class="error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></span>
        </div>
        
        <div class="form-group">
            <label for="endDate">レッスン終了日時 *</label>
            <input type="datetime-local" th:field="*{endDate}" id="endDate" required />
            <span class="error" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></span>
        </div>
        
        <!-- 次回予約情報 -->
        <div class="form-group">
            <label for="nextDate">次回レッスン予約日</label>
            <input type="datetime-local" th:field="*{nextDate}" id="nextDate" />
        </div>
        
        <div class="form-group">
            <label for="nextStoreId">次回実施店舗</label>
            <select th:field="*{nextStoreId}" id="nextStoreId">
                <option value="">選択してください</option>
                <option th:each="store : ${stores}" 
                        th:value="${store.id}" 
                        th:text="${store.name}"></option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="nextTrainerId">次回担当トレーナー</label>
            <select th:field="*{nextTrainerId}" id="nextTrainerId">
                <option value="">選択してください</option>
                <option th:each="trainer : ${trainers}" 
                        th:value="${trainer.id}" 
                        th:text="${trainer.name}"></option>
            </select>
        </div>
        
        <!-- 備考 -->
        <div class="form-group">
            <label for="memo">備考</label>
            <textarea th:field="*{memo}" id="memo" rows="4" placeholder="レッスンに関する特記事項"></textarea>
            <span class="error" th:if="${#fields.hasErrors('memo')}" th:errors="*{memo}"></span>
        </div>
        
        <!-- ボタン -->
        <div class="button-group">
            <button type="submit">保存</button>
            <button type="button" class="cancel-button" onclick="history.back()">キャンセル</button>
        </div>
    </form>
    
    <script th:inline="javascript">
        // BMI自動計算
        const weightInput = document.getElementById('weight');
        const bmiDisplay = document.getElementById('bmiDisplay');
        const customerHeight = /*[[${customer.height}]]*/ 0;
        
        weightInput.addEventListener('input', function() {
            const weight = parseFloat(this.value);
            if (weight && customerHeight) {
                const heightInMeters = customerHeight / 100;
                const bmi = (weight / (heightInMeters * heightInMeters)).toFixed(2);
                bmiDisplay.textContent = 'BMI: ' + bmi;
            } else {
                bmiDisplay.textContent = '';
            }
        });

        // トレーニングセクション管理
        let trainingIndex = 0;
        const trainingsContainer = document.getElementById('trainings-container');
        const addTrainingBtn = document.getElementById('addTrainingBtn');

        // トレーニングセクションを生成する関数
        function createTrainingSection(index) {
            const section = document.createElement('div');
            section.className = 'training-section';
            section.dataset.index = index;
            
            const orderNo = index + 1;
            
            section.innerHTML = `
                <div class="training-section-header">
                    <h3>トレーニング${orderNo}</h3>
                    <button type="button" class="delete-training-btn" onclick="removeTrainingSection(${index})">削除</button>
                </div>
                <div class="form-group">
                    <label for="training${index}Name">種目名</label>
                    <input type="text" name="trainings[${index}].name" id="training${index}Name" placeholder="例: ベンチプレス" />
                </div>
                <div class="form-group">
                    <label for="training${index}Reps">回数</label>
                    <input type="number" name="trainings[${index}].reps" id="training${index}Reps" placeholder="例: 80" />
                </div>
                <input type="hidden" name="trainings[${index}].orderNo" value="${orderNo}" />
            `;
            
            return section;
        }

        // トレーニングセクションを追加する関数
        function addTrainingSection() {
            const section = createTrainingSection(trainingIndex);
            trainingsContainer.appendChild(section);
            trainingIndex++;
            updateDeleteButtons();
        }

        // トレーニングセクションを削除する関数
        function removeTrainingSection(index) {
            const sections = trainingsContainer.querySelectorAll('.training-section');
            const sectionToRemove = Array.from(sections).find(s => parseInt(s.dataset.index) === index);
            
            if (sectionToRemove) {
                sectionToRemove.remove();
                reindexTrainingSections();
                updateDeleteButtons();
            }
        }

        // トレーニングセクションのインデックスを再設定
        function reindexTrainingSections() {
            const sections = Array.from(trainingsContainer.querySelectorAll('.training-section'));
            trainingIndex = 0;
            
            sections.forEach((section, newIndex) => {
                section.dataset.index = newIndex;
                
                const orderNo = newIndex + 1;
                const header = section.querySelector('h3');
                header.textContent = `トレーニング${orderNo}`;
                
                // 削除ボタンのonclickを更新
                const deleteBtn = section.querySelector('.delete-training-btn');
                deleteBtn.setAttribute('onclick', `removeTrainingSection(${newIndex})`);
                
                // 入力フィールドのname属性とidを更新
                const nameInput = section.querySelector('input[type="text"]');
                const repsInput = section.querySelector('input[type="number"]');
                const orderNoInput = section.querySelector('input[type="hidden"]');
                
                nameInput.name = `trainings[${newIndex}].name`;
                nameInput.id = `training${newIndex}Name`;
                repsInput.name = `trainings[${newIndex}].reps`;
                repsInput.id = `training${newIndex}Reps`;
                orderNoInput.name = `trainings[${newIndex}].orderNo`;
                orderNoInput.value = orderNo;
                
                // ラベルのfor属性を更新
                const labels = section.querySelectorAll('label');
                if (labels.length >= 2) {
                    labels[0].setAttribute('for', `training${newIndex}Name`);
                    labels[1].setAttribute('for', `training${newIndex}Reps`);
                }
                
                trainingIndex = newIndex + 1;
            });
        }

        // 削除ボタンの有効/無効を更新（最低1つは残す）
        function updateDeleteButtons() {
            const sections = trainingsContainer.querySelectorAll('.training-section');
            const deleteButtons = trainingsContainer.querySelectorAll('.delete-training-btn');
            
            if (sections.length <= 1) {
                deleteButtons.forEach(btn => btn.disabled = true);
            } else {
                deleteButtons.forEach(btn => btn.disabled = false);
            }
        }

        // トレーニング追加ボタンのイベントリスナー
        addTrainingBtn.addEventListener('click', addTrainingSection);

        // 初期状態で1つのトレーニングセクションを追加
        addTrainingSection();
    </script>
    </div>
</body>
</html>
