<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レッスン履歴一覧 | フィットネスジム管理システム</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .detail-link {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        .detail-link:hover {
            text-decoration: underline;
        }
        .button-group {
            margin-bottom: 20px;
        }
        button, .button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        button:hover, .button:hover {
            background: #0056b3;
        }
        .no-data {
            padding: 40px;
            text-align: center;
            color: #999;
        }
    </style>
</head>
<body>
    <h1>レッスン履歴一覧</h1>
    
    <div class="button-group">
        <a th:href="@{${storeId != null ? '/manager/' + storeId + '/lessons/new?customerId=' + customerId : '/admin/lessons/new?customerId=' + customerId}}" 
           class="button" th:if="${customerId != null}">
            新規レッスン入力
        </a>
    </div>
    
    <div th:if="${lessons != null and !lessons.isEmpty()}">
        <table>
            <thead>
                <tr>
                    <th>実施日時</th>
                    <th>顧客名</th>
                    <th>トレーナー</th>
                    <th>店舗</th>
                    <th>体重</th>
                    <th>詳細</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="lesson : ${lessons}">
                    <td th:text="${#temporals.format(lesson.startDate, 'yyyy/MM/dd HH:mm')}"></td>
                    <td th:text="${lesson.customerName}"></td>
                    <td th:text="${lesson.trainerName}"></td>
                    <td th:text="${lesson.storeName}"></td>
                    <td>
                        <span th:if="${lesson.weight != null}" th:text="${lesson.weight} + ' kg'"></span>
                        <span th:if="${lesson.weight == null}">-</span>
                    </td>
                    <td>
                        <a th:href="@{${storeId != null ? '/manager/' + storeId + '/lessons/' + lesson.id : '/admin/lessons/' + lesson.id}}" 
                           class="detail-link">
                            詳細を見る
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <div th:if="${lessons == null or lessons.isEmpty()}" class="no-data">
        レッスン履歴がありません
    </div>
</body>
</html>
