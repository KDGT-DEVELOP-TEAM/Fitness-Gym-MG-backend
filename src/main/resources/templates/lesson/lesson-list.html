<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>統計情報</title>

	<link rel="stylesheet" th:href="@{/css/reset.css}" />
	<link rel="stylesheet" th:href="@{/css/style.css}" />
	<style>
		table {
			width: 100%;
			border-collapse: collapse;
			margin-top: 20px;
		}

		table th,
		table td {
			border: 1px solid #ccc;
			padding: 8px 10px;
			text-align: left;
		}

		table th {
			font-weight: bold;
		}
	</style>

	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0/dist/chartjs-plugin-datalabels.min.js"></script>

	<script th:inline="javascript">
		/* <![CDATA[ */
		// ★ 修正: Controllerから渡される動的なBASE_PATHを取得 ★
		// 例: /admin/lessons または /manager/{storeId}/lessons
		const BASE_PATH = /*[[${BASE_PATH}]]*/ '/lessons';
		/* ]]> */

		document.addEventListener("DOMContentLoaded", () => {

			/* 共通関数：右端へスクロール */
			function scrollToRight(selector) {
				const elem = document.querySelector(selector).parentElement;
				elem.scrollLeft = elem.scrollWidth;
			}

			/* --- フィルタ送信 (共通) --- */
			const filterForm = document.getElementById("filterForm");
			filterForm.onsubmit = (e) => {
				e.preventDefault();
				const params = new URLSearchParams(new FormData(e.target));

				// 現在選択中のグラフタイプも付与
				params.set('chartType', document.querySelector('input[name="chartType"]:checked').value);

				// ★ 修正: 動的な BASE_PATH を使用して遷移 ★
				location.href = `${BASE_PATH}?${params.toString()}`;
			};


			/* --- グラフ切り替え（週 ⇄ 月） --- */
			document.querySelectorAll('input[name="chartType"]').forEach(radio => {
				radio.onchange = () => {
					// フォーム送信（ → ページがリロード → Chart.js を描画 ）
					filterForm.dispatchEvent(new Event('submit', {cancelable: true}));
				};
			});


			/* --- Chart.js 描画処理 --- */
			const chartDataContainer = document.getElementById("chartDataContainer");
			if (!chartDataContainer) {
				console.error("chartDataContainer not found");
				return;
			}

			const chartDataJson = chartDataContainer.getAttribute('data-chart-data');
			if (!chartDataJson || chartDataJson === '{}' || chartDataJson === 'null') {
				console.warn("chartData is empty or null");
				return;
			}

			const chartData = JSON.parse(chartDataJson);
			if (!chartData || !chartData.series || chartData.series.length === 0) {
				console.warn("chartData.series is empty");
				return;
			}

			const labels = chartData.series.map(item => item.label);
			const counts = chartData.series.map(item => item.count);

			// 最大カウントが0の場合、グラフの最大値を10に設定して表示崩れを防ぐ
			const maxCount = chartData.maxCount > 0 ? chartData.maxCount : 10;

			const ctx = document.getElementById('lessonChart');
			if (!ctx) {
				console.error("lessonChart canvas not found");
				return;
			}

			Chart.register(ChartDataLabels);

			new Chart(ctx.getContext('2d'), {
				type: 'bar',
				data: {
					labels: labels,
					datasets: [{
						data: counts,
						backgroundColor: 'rgba(75, 192, 192, 0.8)',
						borderRadius: 2,
					}]
				},
				options: {
					maintainAspectRatio: false,
					responsive: true,
					scales: {
						x: {
							grid: {display: false}
						},
						y: {
							max: maxCount,
							beginAtZero: true,
							ticks: {
								stepSize: maxCount > 10 ? Math.ceil(maxCount / 5) : 1,
								callback: () => '' // Y軸メモリ非表示
							},
							grid: {display: false}
						}
					},
					plugins: {
						legend: {display: false},
						tooltip: {
							callbacks: {
								label: context => context.raw + '回'
							}
						},
						datalabels: {
							anchor: 'end',
							align: 'top',
							color: '#000',
							font: {weight: 'bold', size: 14},
							formatter: value => value
						}
					}
				}
			});

			/* --- 初期表示 → 右端へ --- */
			scrollToRight('#lessonChart');

		});
	</script>

</head>

<body>
	<!-- サイドバー -->
	<div class="sidebar" th:if="${isTrainer}">
		<h2>メニュー</h2>
		<ul>
			<li>
				<a th:href="@{'/trainer/history/' + ${customerId}}" class="active">履歴一覧</a>
			</li>
			<li>
				<a th:href="@{'/trainer/customers/' + ${customerId}}" class="">顧客プロフィール</a>
			</li>
			<li>
				<a th:href="@{'/trainer/postures?customerId=' + ${customerId}}" class="">姿勢画像一覧</a>
			</li>
			<li>
				<a th:href="@{'/trainer/lessons/new?customerId=' + ${customerId}}" class="">新規レッスン入力</a>
			</li>
		</ul>
	</div>
	
	<!-- メインコンテンツ -->
	<div class="main-content" th:classappend="${isTrainer} ? 'with-sidebar' : ''">
	<!-- 統計情報セクション（トレーナーの場合は非表示） -->
	<div th:unless="${isTrainer}">
		<h2>統計情報</h2>

		<div th:if="${storeId == null}">
			<form id="filterForm">
				<select name="storeId">
					<option value="">全ての店舗</option>
					<option th:each="s : ${stores}" th:value="${s.id}" th:text="${s.name}"
						th:selected="${storeId != null and storeId.toString() == s.id.toString()}"></option>
				</select>

				<button type="submit">検索</button>
			</form>
		</div>
		
		<div th:unless="${storeId == null}">
			<form id="filterForm">
				<p>
					所属店舗: <span th:each="s : ${stores}" th:if="${storeId != null and storeId.toString() == s.id.toString()}" th:text="${s.name}"></span>
				</p>
				<input type="hidden" name="storeId" th:value="${storeId}" />
				<button type="submit" style="display: none;">検索</button>
			</form>
		</div>
		<div id="chartDataContainer" th:attr="data-chart-data=${jsonUtils.toJson(chartData)}" style="display: none;">
		</div>

		<div class="chart-section">
			<h3>レッスン回数グラフ</h3>

			<label><input type="radio" name="chartType" value="week" th:checked="${chartType == 'week'}"> 週別</label>
			<label><input type="radio" name="chartType" value="month" th:checked="${chartType == 'month'}"> 月別</label>

			<div style="max-height: 60vh; overflow-x: auto;">
				<canvas id="lessonChart"></canvas>
			</div>

			<p>※右端が最新、左にスクロールで過去に遡ります</p>
		</div>

		<hr>
	</div>

		<h3>レッスン履歴一覧 (<span th:text="${lessonPage.totalElements}"></span> 件)</h3>

		<div th:if="${lessonPage.content.isEmpty()}">該当するレッスンデータはありません</div>

		<table>
			<thead>
				<tr>
					<th>実施日時</th>
					<th>実施店舗</th>
					<th>担当トレーナー</th>
					<th>顧客</th>
					<th>操作</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="lesson : ${lessonPage.content}">
					<td>
						<span th:text="${#temporals.format(lesson.startDate, 'yyyy/MM/dd')}"></span><br>
						<span
							th:text="${#temporals.format(lesson.startDate, 'HH:mm')} + ' - ' + ${#temporals.format(lesson.endDate, 'HH:mm')}"></span>
					</td>
					<td th:text="${lesson.storeName}"></td>
					<td th:text="${lesson.trainerName}"></td>
					<td th:text="${lesson.customerName}"></td>
					<td>
						<a th:href="@{${DETAIL_BASE_PATH} + '/' + ${lesson.id}}">詳細</a>
					</td>
				</tr>
			</tbody>
		</table>

		<div class="pagination" th:if="${lessonPage.totalPages > 1}">
			<a th:if="${lessonPage.hasPrevious()}"
				th:href="@{${BASE_PATH}(page=${lessonPage.number - 1}, storeId=${storeId}, keyword=${keyword}, chartType=${chartType}, size=10)}">前へ</a>

			<span th:text="${lessonPage.number + 1}"></span> /
			<span th:text="${lessonPage.totalPages}"></span>

			<a th:if="${lessonPage.hasNext()}"
				th:href="@{${BASE_PATH}(page=${lessonPage.number + 1}, storeId=${storeId}, keyword=${keyword}, chartType=${chartType}, size=10)}">次へ</a>
		</div>

</body>

</html>
