<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ユーザー一覧</title>

<style>
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    table th, table td {
        border: 1px solid #ccc;
        padding: 8px 10px;
        text-align: left;
    }
    table th {
        font-weight: bold;
    }
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {

    // 検索フォーム
    document.getElementById("filterForm").onsubmit = (e) => {
        e.preventDefault();
        const params = new URLSearchParams(new FormData(e.target));
        location.href = `/users?${params.toString()}`;
    };

    document.getElementById("clearBtn").onclick = () => {
        location.href = "/users";
    };


    // 新規作成モーダル
    document.getElementById("openCreateModal").onclick = () => {
        document.getElementById("createForm").reset();
        document.getElementById("createModal").style.display = "block";
    };

    document.getElementById("createForm").onsubmit = async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));

        data.active = true;

        await fetch("/users", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });

        location.reload();
    };


    // 有効/無効
    document.querySelectorAll(".toggleActive").forEach(btn => {
        btn.onclick = async () => {
            await fetch(`/users/${btn.dataset.id}/active`, {method:"PATCH"});
            location.reload();
        };
    });


    // 削除
    document.querySelectorAll(".deleteBtn").forEach(btn => {
        btn.onclick = async () => {
            if (!confirm("削除しますか？")) return;
            await fetch(`/users/${btn.dataset.id}`, {method:"DELETE"});
            location.reload();
        };
    });


    // 編集モーダル
    document.querySelectorAll(".editBtn").forEach(btn => {
        btn.onclick = async () => {

            const id = btn.dataset.id;
            const form = document.getElementById("editForm");

            // サーバーからユーザー取得
            const res = await fetch(`/users/${id}`);
            const user = await res.json();

            form.id.value       = user.id;
            document.getElementById("edit-id-display").value = user.id;

            form.name.value     = user.name;
            form.kana.value     = user.kana;
            form.email.value    = user.email;
            form.role.value     = user.role;

            form.active.checked = user.active;

            document.getElementById("editModal").style.display = "block";
        };
    });

    // 編集保存
    document.getElementById("editForm").onsubmit = async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));

        data.active = e.target.active.checked;

        await fetch(`/users/${data.id}`, {
            method:"PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });

        location.reload();
    };
	
	// モーダルを閉じる
	document.querySelectorAll(".closeModal").forEach(btn => {
	    btn.onclick = () => {
	        btn.closest(".modal").style.display = "none";
	    };
	});

});
</script>
</head>

<body>
<!-- 新規作成ボタン -->
<button id="openCreateModal">＋ 新規ユーザー作成</button>

<!-- 検索フォーム -->
<form id="filterForm">
    <input type="text" name="keyword" placeholder="名前検索（漢字・ふりがな）" th:value="${keyword}">

    <select name="role">
        <option value="">すべて</option>
        <option value="ADMIN"   th:selected="${role == 'ADMIN'}">admin</option>
        <option value="MANAGER" th:selected="${role == 'MANAGER'}">manager</option>
        <option value="TRAINER" th:selected="${role == 'TRAINER'}">trainer</option>
    </select>

    <select name="sort">
        <option value="created" th:selected="${sort == 'created'}">作成日順</option>
        <option value="kana"    th:selected="${sort == 'kana'}">50音順</option>
    </select>

    <button type="submit">検索</button>
    <button type="button" id="clearBtn">クリア</button>
</form>

<p><span th:text="${count}"></span> 件が見つかりました</p>

<!-- 一覧テーブル -->
<table>
    <tr>
        <th>名前</th>
        <th>ロール</th>
        <th>有効</th>
        <th>操作</th>
    </tr>

    <tr th:each="u : ${users}">
        <td th:text="${u.name}"></td>
        <td th:text="${u.role}"></td>

        <td>
            <button class="toggleActive"
                    th:attr="data-id=${u.id}"
                    th:text="${u.active} ? '有効' : '無効'">
            </button>
        </td>

        <td>
            <button class="editBtn" th:attr="data-id=${u.id}">編集</button>
			<button class="deleteBtn" th:if="${!u.active}" th:attr="data-id=${u.id}">削除</button>
        </td>
    </tr>
</table>


<!-- 新規作成モーダル -->
<div id="createModal" class="modal" style="display:none;">
    <div>
		<button class="closeModal">× 入力情報を保存せず一覧に戻る</button>
        <h2>新規ユーザー作成</h2>
        <form id="createForm">
            <input name="name"  placeholder="名前" required>
            <input name="kana"  placeholder="ふりがな" required>
            <input name="email" placeholder="メール" required>

            <select name="role" required>
                <option value="">ロール選択</option>
                <option value="ADMIN">admin</option>
                <option value="MANAGER">manager</option>
                <option value="TRAINER">trainer</option>
            </select>

            <input name="pass" placeholder="パスワード" required>

            <button type="submit">保存</button>
        </form>
    </div>
</div>


<!-- 編集モーダル -->
<div id="editModal" class="modal" style="display:none;">
    <div>
		<button class="closeModal">× 入力情報を保存せず一覧に戻る</button>
        <h2>ユーザー編集</h2>
        <form id="editForm">
            <input type="hidden" name="id">

            <label>ユーザーID</label>
            <input id="edit-id-display" disabled>

            <input name="name" required placeholder="名前">
            <input name="kana" required placeholder="ふりがな">
            <input name="email" required placeholder="メール">

            <select name="role" required>
                <option value="ADMIN">admin</option>
                <option value="MANAGER">manager</option>
                <option value="TRAINER">trainer</option>
            </select>

            <input type="password" name="pass" placeholder="パスワード（変更時のみ）">

            <button type="submit">保存</button>
        </form>
    </div>
</div>

</body>
</html>
